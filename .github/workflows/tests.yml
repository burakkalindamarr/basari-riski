name: Model tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test requirements
        run: python -m pip install numpy==2.2.6 pandas==2.3.3 scikit-learn==1.7.2 pytest==9.0.2
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: Candidate model artifact smoke test
        run: python -m experiments.train_candidate --algorithm gradient_boosting
