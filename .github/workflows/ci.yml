name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Model and API tests
        run: python -m pytest tests backend/tests -q
      - name: Training smoke test
        run: python -m experiments.train_candidate --algorithm gradient_boosting

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start API
        run: |
          python -m pip install -r backend/requirements.txt
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/academic-api.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health
      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Save failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-debug
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
      - name: Show API errors
        if: failure()
        run: tail -80 /tmp/academic-api.log || true
